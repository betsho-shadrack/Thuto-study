name: Build Android APK

# Runs on every push to main, or manually from the Actions tab.
# Works two ways:
#   1. The project files are in the repo (normal layout), or
#   2. You uploaded a single file called thuto-study.zip to the repo root.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Locate the app
        run: |
          if [ -f thuto-study.zip ]; then
            mkdir -p _app
            unzip -q -o thuto-study.zip -d _app
            DIR=$(dirname "$(find _app -maxdepth 3 -name package.json -not -path '*/node_modules/*' | head -1)")
          else
            DIR=.
          fi
          echo "App folder: $DIR"
          ls -la "$DIR"
          echo "APP_DIR=$DIR" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Align package versions with the installed Expo SDK
        working-directory: ${{ env.APP_DIR }}
        run: npx expo install --fix

      - name: Generate the native Android project
        working-directory: ${{ env.APP_DIR }}
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK (64-bit ARM phones)
        working-directory: ${{ env.APP_DIR }}/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: thuto-study-apk
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/release/*.apk
